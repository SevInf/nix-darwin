onboarding = false

[ui.toast]
delivery = "terminal"

[keys]
prefix = "ctrl+a"
split_vertical = "prefix+|"

[worktrees]
directory = "/Users/sevinf/projects/worktrees/"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = '''
GH_PAGER=cat gh pr view --json url --jq .url
printf '\nPress Enter to close'
read -r _
'''
description = "Show current branch PR link"
width = "80%"
height = 7

[[keys.command]]
key = "prefix+r"
type = "shell"
command = "tuicr-herdr"
description = "Review changes and submit feedback to agent"
