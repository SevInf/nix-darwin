user:
  name: sevinf
  uid: 1500
  home: /home/sevinf
mounts:
  - location: ~/projects
    writable: true
  - location: ~/.config/nix-darwin
    mountPoint: /etc/nixos
  - location: /tmp/lima
    writable: true
ssh:
  forwardAgent: true
base:
  - github:nixos-lima
portForwards:
  # Tell Lima's port-forwarding to ignore port 68 to prevent interception of host DHCP packets
  # Apparently this is an issue with NixOS that does not occur on other Linux distros
  # See: https://github.com/nixos-lima/nixos-lima/issues/50
  - proto: udp
    guestPort: 68
    guestIP: 0.0.0.0
    ignore: true
